<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>BulkPublish — Analytics</title>
  </head>
  <body>
    <main class="analytics" aria-busy="true">
      <header class="analytics__header">
        <h1 class="analytics__title">Analytics</h1>
        <p class="analytics__sub" id="sub">Loading analytics…</p>
      </header>

      <!-- Stat cards row -->
      <section class="stat-cards" id="stat-cards" hidden>
        <div class="stat-card" id="card-published">
          <span class="stat-card__dot stat-card__dot--success"></span>
          <span class="stat-card__value" id="val-published">—</span>
          <span class="stat-card__label">Published</span>
        </div>
        <div class="stat-card" id="card-scheduled">
          <span class="stat-card__dot stat-card__dot--scheduled"></span>
          <span class="stat-card__value" id="val-scheduled">—</span>
          <span class="stat-card__label">Scheduled</span>
        </div>
        <div class="stat-card" id="card-failed">
          <span class="stat-card__dot stat-card__dot--error"></span>
          <span class="stat-card__value" id="val-failed">—</span>
          <span class="stat-card__label">Failed</span>
        </div>
        <div class="stat-card" id="card-total">
          <span class="stat-card__dot stat-card__dot--neutral"></span>
          <span class="stat-card__value stat-card__value--total" id="val-total">—</span>
          <span class="stat-card__label">Total</span>
        </div>
      </section>

      <!-- By platform -->
      <section class="section" id="section-platform" hidden>
        <h2 class="section__title">By platform</h2>
        <div class="bar-list" id="platform-bars"></div>
      </section>

      <!-- Daily activity sparkline -->
      <section class="section" id="section-daily" hidden>
        <h2 class="section__title">Daily activity</h2>
        <div class="sparkline" id="daily-bars"></div>
      </section>

      <!-- Empty state -->
      <div class="empty" id="empty" hidden>
        <p class="empty__text">No analytics yet for this period.</p>
      </div>
    </main>
    <script type="module" src="./analytics.ts"></script>
  </body>
</html>
