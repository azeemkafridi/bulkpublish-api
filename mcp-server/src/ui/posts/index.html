<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>BulkPublish — Posts</title>
  </head>
  <body>
    <main class="posts" aria-busy="true">

    <script type="module" src="./posts.ts"></script>
